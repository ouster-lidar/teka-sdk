[package]
name = "teka-tpk"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bao-tree = { version = "=0.17.0", default-features = false }
base64 = "0.23"
crc32fast = "1"
object = { version = "0.40", default-features = false, features = ["read_core", "pe", "std"] }
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zstd = "0.14"
