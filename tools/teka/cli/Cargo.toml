[package]
name = "ouster-teka"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "teka"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
