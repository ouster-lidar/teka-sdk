[package]
name = "ouster-teka"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "teka"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"
libc = "0.2"
openssl = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teka-pkg = { path = "../package" }
tempfile = "3"

[dev-dependencies]
crc32fast = "1"
