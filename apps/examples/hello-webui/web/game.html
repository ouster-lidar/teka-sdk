<main>
    <div class="stat-card hw-game-card">
        <div class="service-header">
            <div class="service-header-title">Snake · panel demo</div>
            <div class="service-header-actions">
                <span class="hw-score">Score: <strong id="hw-snake-score">0</strong></span>
                <button type="button" class="btn btn-secondary btn-small" id="hw-snake-restart">Restart</button>
            </div>
        </div>
        <p class="config-hint">Arrow keys · eat the orbs · don’t hit the walls or yourself.</p>
        <div class="hw-game-wrap">
            <canvas id="hw-snake-canvas" tabindex="0" aria-label="Snake game"></canvas>
            <div id="hw-snake-overlay" class="hw-snake-overlay" hidden>
                <p id="hw-snake-msg">Game over</p>
            </div>
        </div>
    </div>
</main>
