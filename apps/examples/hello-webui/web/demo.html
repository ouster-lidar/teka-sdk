<div id="hw-dashboard" class="hw-dashboard">
    <header class="hw-header">
        <div>
            <h2>Device overview</h2>
            <p>Sample telemetry · <span class="hw-badge">Simulated data</span></p>
        </div>
        <button type="button" class="btn btn-primary">↻ Refresh samples</button>
    </header>
    <section class="hw-grid" aria-label="Simulated device metrics">
        <article class="stat-card" data-base="640" data-spread="80" data-decimals="0" data-unit=" pkt/s">
            <h3>Traffic</h3>
            <output aria-label="Traffic">—</output>
            <svg viewBox="0 0 240 72" role="img" aria-label="Simulated traffic trend">
                <polyline />
            </svg>
        </article>
        <article class="stat-card" data-base="12" data-spread="2" data-decimals="1" data-unit=" ms">
            <h3>Latency</h3>
            <output aria-label="Latency">—</output>
            <svg viewBox="0 0 240 72" role="img" aria-label="Simulated latency trend">
                <polyline />
            </svg>
        </article>
        <article class="stat-card" data-base="42" data-spread="6" data-decimals="0" data-unit="%" data-max="100">
            <h3>CPU load</h3>
            <output aria-label="CPU load">—</output>
            <svg viewBox="0 0 240 72" role="img" aria-label="Simulated CPU load trend">
                <polyline />
            </svg>
        </article>
    </section>
    <small data-updated></small>
</div>
