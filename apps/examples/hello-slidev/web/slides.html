<div class="hs-toolbar" id="hs-toolbar" hidden>
    <label class="mc-switch hs-guest-access" title="Allow guests to view the Slidev deck">
        <input type="checkbox" class="mc-switch-cb" id="hs-guest-access" disabled>
        <span class="mc-switch-track" aria-hidden="true"></span>
        <span class="mc-switch-text">Guest access</span>
    </label>
    <span class="hs-toolbar-hint" id="hs-guest-hint"></span>
</div>
<iframe
    class="hs-slidev-frame"
    id="hs-slidev-frame"
    title="Hello Slidev"
    src="about:blank"
    allowfullscreen
></iframe>
