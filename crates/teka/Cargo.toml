[package]
name = "teka"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Teka application runtime, device client, and signed TPK packages"
readme = "README.md"

[features]
default = ["app"]
app = ["dep:axum", "dep:libc", "dep:parking_lot", "dep:reqwest", "dep:rustix", "dep:sd-notify", "dep:serde", "dep:serde_json", "dep:signal-hook", "dep:socket2", "dep:tokio", "dep:tracing"]
client = ["dep:anyhow", "dep:reqwest", "dep:serde_json", "reqwest/cookies", "reqwest/rustls-tls"]
tpk = ["dep:anyhow", "dep:bao-tree", "dep:base64", "dep:crc32fast", "dep:object", "dep:openssl", "dep:serde", "dep:serde_json", "dep:tempfile", "dep:zstd"]

[[bin]]
name = "teka-runner"
path = "src/bin/teka-runner.rs"
required-features = ["app"]

[dependencies]
anyhow = { version = "1", optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
bao-tree = { version = "=0.17.0", default-features = false, optional = true }
base64 = { version = "0.23", optional = true }
crc32fast = { version = "1", optional = true }
libc = { version = "0.2", optional = true }
object = { version = "0.40", default-features = false, features = ["read_core", "pe", "std"], optional = true }
openssl = { version = "0.10", optional = true }
parking_lot = { version = "0.12", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"], optional = true }
rustix = { version = "1", features = ["process"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
signal-hook = { version = "0.3", default-features = false, optional = true }
socket2 = { version = "0.6", optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["sync", "time", "signal", "rt-multi-thread", "process"], optional = true }
tracing = { version = "0.1", optional = true }
zstd = { version = "0.14", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = { version = "0.5", optional = true }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
