[package]
name = "teka-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Build, package, and deploy Teka apps and systems"
readme = "README.md"

[[bin]]
name = "teka"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"
libc = "0.2"
openssl = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teka = { path = "../teka", version = "0.1.0", default-features = false, features = ["client", "tpk"] }
tempfile = "3"

[dev-dependencies]
crc32fast = "1"
